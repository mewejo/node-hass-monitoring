name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax check every script
        run: |
          status=0
          while IFS= read -r file; do
            bash -n "$file" || { echo "syntax error: $file"; status=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $status

      - name: shellcheck
        run: shellcheck --severity=warning --external-sources $(find . -name '*.sh' -not -path './.git/*')

      - name: Check for committed secrets
        # This is a public repo. The installer prompts for the broker password
        # and writes it on the node; nothing environment-specific should ever
        # be committed. The test broker's dummy credentials are the one
        # deliberate exception and live only in scripts/dev-broker.sh.
        run: |
          if git grep -nIE '(password|passwd|secret|token)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9_-]{8,}' \
              -- . ':!scripts/dev-broker.sh' ':!tests/' ':!.github/'; then
            echo "::error::possible committed credential"
            exit 1
          fi
          if [ -e tests/broker/passwd ] || [ -d tests/broker/certs ]; then
            echo "::error::generated broker credentials must not be committed"
            exit 1
          fi

  # The agent has to run on whatever distro a node happens to be. This matrix
  # exists to catch the cross-distro assumptions the design depends on -- the
  # nologin path differs between Debian and Arch, `hostname` is not installed by
  # default on Arch, and bash must have /dev/tcp compiled in. None of that needs
  # a broker, so these stay fast.
  unit:
    name: unit (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian:stable
          - ubuntu:latest
          - archlinux:latest
    steps:
      - name: Install test prerequisites
        # Python and git are for the test harness only. Nothing here is
        # required by the agent itself -- that is the entire point of the
        # project, and the "no dependencies" claim is asserted in its own job
        # below rather than assumed.
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq python3 git ca-certificates
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm --quiet python git
          fi

      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "distro:  $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "bash:    $BASH_VERSION"
          echo "nologin: $(command -v nologin || echo '(not in PATH)')"
          echo "hostname binary: $(command -v hostname || echo '(absent - uname -n is used instead)')"

      - name: Verify bash has /dev/tcp support
        run: |
          probe=$(bash -c 'exec 3<>/dev/tcp/127.0.0.1/1' 2>&1 || true)
          case "$probe" in
            *"No such file"*|*"not supported"*)
              echo "::error::bash lacks /dev/tcp support on ${{ matrix.distro }}"
              exit 1 ;;
          esac
          echo "ok: $probe"

      - name: Run unit tests
        run: ./tests/run.sh unit

  # Guards the core promise: the agent must run on a node with no packages
  # installed beyond a base system. Anything that creeps in as a dependency
  # fails here rather than on someone's Proxmox box.
  no-dependencies:
    name: no extra dependencies
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v4

      - name: Confirm no MQTT client is present
        run: |
          for cmd in mosquitto_pub mosquitto_sub python3 python perl nc socat curl; do
            if command -v "$cmd" >/dev/null; then
              echo "note: $cmd exists in this image but must not be required"
            fi
          done
          # Remove the obvious candidates so a hidden dependency cannot hide.
          apt-get remove -y -qq curl 2>/dev/null || true

      - name: Build sysfs fixtures
        # The fake /sys trees are generated rather than committed, and this job
        # reads them directly instead of going through tests/run.sh, which
        # builds them on demand.
        run: ./tests/fixtures/make-fixtures.sh

      - name: Collect temperatures with nothing installed
        run: |
          SYSFS_ROOT=tests/fixtures/sysfs-typical bash -c '
            source lib/sensors.sh
            source lib/discovery.sh
            NODE_ID=ci NODE_NAME=ci DISCOVERY_PREFIX=homeassistant
            STATE_TOPIC=nodemon/ci/state INTERVAL=60 AGENT_VERSION=test
            records=$(sensors_collect_temperatures)
            [ -n "$records" ] || { echo "no sensors collected"; exit 1; }
            printf "%s\n" "$records" | discovery_state_payload
          '

      - name: Build MQTT packets with nothing installed
        run: |
          bash -c '
            source lib/mqtt.sh
            frame=$(mqtt_build_publish "a/b" "hi" 1)
            printf "%b" "$frame" | od -An -tx1
          '

  # The GitHub runner is a throwaway VM with real systemd as PID 1, so the
  # timer and the service sandboxing can be tested properly rather than by
  # hand on a real node. This installs for real, as root, and waits for the
  # timer to fire on its own.
  systemd:
    name: systemd end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the broker
        run: ./scripts/dev-broker.sh up

      - name: Build sysfs fixtures outside /home
        # A CI runner is a VM and usually exposes no temperature sensors at
        # all, so the agent needs fixtures to have anything to report.
        #
        # They must live outside /home because the service sets
        # ProtectHome=true and genuinely cannot read there -- which is itself
        # worth proving, since it is the kind of hardening that looks harmless
        # until it silently breaks the thing it protects.
        run: |
          ./tests/fixtures/make-fixtures.sh
          sudo mkdir -p /opt/hnm-fixtures
          sudo cp -r tests/fixtures/sysfs-typical /opt/hnm-fixtures/

      - name: Install for real
        run: |
          sudo MQTT_HOST=127.0.0.1 MQTT_PORT=1883 INTERVAL=10 \
            bash install.sh --non-interactive

      - name: Point the agent at the fixture tree
        # config.env is sourced before the collector runs, so this reaches
        # sensors.sh the same way any other setting does.
        run: |
          echo 'SYSFS_ROOT=/opt/hnm-fixtures/sysfs-typical' | sudo tee -a /etc/hass-node-monitor/config.env
          sudo systemctl restart hass-node-monitor.timer

      - name: Service runs under its sandbox without failing
        run: |
          sudo systemctl start hass-node-monitor.service
          sudo systemctl status hass-node-monitor.service --no-pager || true
          # A oneshot that exited non-zero shows as failed.
          if systemctl is-failed --quiet hass-node-monitor.service; then
            echo "::error::service failed under its systemd sandbox"
            sudo journalctl -u hass-node-monitor.service -n 50 --no-pager
            exit 1
          fi

      - name: Confirm it runs unprivileged
        run: |
          user=$(systemctl show -p User --value hass-node-monitor.service)
          echo "service user: ${user:-root}"
          [ "$user" = "hass-node-monitor" ] || { echo "::error::expected unprivileged user"; exit 1; }
          id hass-node-monitor

      - name: Timer fires on its own
        run: |
          systemctl list-timers hass-node-monitor.timer --no-pager

          before=$(systemctl show -p NRestarts,ExecMainStartTimestampMonotonic \
            --value hass-node-monitor.service | head -1)

          # Subscribe, then wait long enough for two 10 second firings.
          docker run --rm -d --name hnm-timer --network host eclipse-mosquitto:2.0.22 \
            mosquitto_sub -h 127.0.0.1 -p 1883 -t 'nodemon/+/state' -F '%p' >/dev/null
          sleep 25

          received=$(docker logs hnm-timer 2>/dev/null | grep -c . || true)
          docker rm -f hnm-timer >/dev/null

          echo "state messages received in 25s: ${received}"
          if [ "${received:-0}" -lt 2 ]; then
            echo "::error::timer did not fire repeatedly (expected at least 2 in 25s)"
            sudo journalctl -u hass-node-monitor.service -n 50 --no-pager
            exit 1
          fi

      - name: Device is discoverable in Home Assistant
        run: |
          node=$(uname -n | cut -d. -f1 | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '_')
          count=$(docker run --rm --network host eclipse-mosquitto:2.0.22 \
            mosquitto_sub -h 127.0.0.1 -p 1883 -t 'homeassistant/sensor/+/+/config' -F '%t' -W 3 2>/dev/null \
            | grep -c . || true)
          echo "retained discovery configs: ${count}"
          [ "${count:-0}" -ge 15 ] || { echo "::error::expected a discovery config per sensor"; exit 1; }

      - name: State survives a reboot of the unit
        # Proves the state directory is writable under ProtectSystem=strict;
        # without the ReadWritePaths exception the agent cannot record what it
        # published and stale-entity cleanup silently stops working.
        run: |
          sudo test -s /var/lib/hass-node-monitor/published-entities
          echo "entities recorded: $(sudo wc -l < /var/lib/hass-node-monitor/published-entities)"

      - name: Uninstall removes units, files and HA entities
        run: |
          sudo bash install.sh --uninstall

          systemctl list-unit-files | grep hass-node-monitor && \
            { echo "::error::units still present"; exit 1; } || true
          test ! -e /etc/hass-node-monitor || { echo "::error::config left behind"; exit 1; }
          test ! -e /usr/local/lib/hass-node-monitor || { echo "::error::agent left behind"; exit 1; }

          remaining=$(docker run --rm --network host eclipse-mosquitto:2.0.22 \
            mosquitto_sub -h 127.0.0.1 -p 1883 -t 'homeassistant/sensor/+/+/config' -F '%t' -W 3 2>/dev/null \
            | grep -c . || true)
          echo "discovery configs remaining: ${remaining}"
          [ "${remaining:-0}" -eq 0 ] || { echo "::error::entities left in Home Assistant"; exit 1; }

      - name: Journal on failure
        if: failure()
        run: sudo journalctl -u hass-node-monitor.service -n 100 --no-pager
        continue-on-error: true

      - name: Stop the broker
        if: always()
        run: ./scripts/dev-broker.sh down

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the broker
        # Real eclipse-mosquitto, pinned. The client under test is ours; the
        # broker and the verifying subscriber deliberately are not, so these
        # tests prove interoperability rather than self-consistency.
        run: ./scripts/dev-broker.sh up

      - name: Run integration tests
        run: ./tests/run.sh integration

      - name: Broker logs on failure
        if: failure()
        run: ./scripts/dev-broker.sh logs
        continue-on-error: true

      - name: Stop the broker
        if: always()
        run: ./scripts/dev-broker.sh down
