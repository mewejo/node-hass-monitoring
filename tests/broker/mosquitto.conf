# Mosquitto config for the local dev broker and CI. Shared by both so a local
# pass means a CI pass.
#
# A config is mandatory, not optional polish: mosquitto 2.x defaults to
# listening on localhost only and denying anonymous connections, so the stock
# image with no config looks broken from outside the container.

# Without this, allow_anonymous and password_file are GLOBAL settings and the
# last one in the file wins for every listener — which silently made the
# authenticated listener accept anonymous connections, and would have made the
# auth tests pass against a broker that was not actually checking anything.
per_listener_settings true

# Happy path: anonymous, no TLS.
listener 1883 0.0.0.0
allow_anonymous true

# Authenticated listener. Exercises the username/password flags in CONNECT and,
# with a wrong password, the CONNACK error path.
listener 1884 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# TLS listener, exercising the openssl s_client transport. The certificate is
# self-signed and generated on first run by scripts/dev-broker.sh.
listener 8883 0.0.0.0
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

log_type warning
log_type error
persistence false
